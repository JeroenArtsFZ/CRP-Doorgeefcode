<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ZD code scanner</title>
<meta name="theme-color" content="#2b7175">
<meta name="color-scheme" content="light">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ZD scanner">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
@font-face{font-family:"Montserrat";font-weight:700;font-display:swap;src:url(fonts/montserrat-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Open Sans";font-weight:400;font-display:swap;src:url(fonts/open-sans-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Open Sans";font-weight:700;font-display:swap;src:url(fonts/open-sans-latin-700-normal.woff2) format("woff2")}

/* Layout: single-column phone tool in the Fonkelzorg house style (light only); a full-screen live camera view with a scan frame opens on top */
:root{
  color-scheme:light;
  --bg:#f4f7f7; --surface:#ffffff; --fg:#1f2b33; --muted:#4f5f69; --line:#d5e0e1;
  --teal:#2b7175; --teal-dark:#1f5558; --teal-light:#7ebec5; --yellow:#e4c800;
  --warn:#9a3412; --warn-bg:#fff1e6; --ok:#2b7175;
  --font-head:"Montserrat",Helvetica,Arial,sans-serif;
  --font-body:"Open Sans",Arial,sans-serif;
  --font-mono:ui-monospace,Menlo,Consolas,"Roboto Mono",monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:17px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:48px 32px}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

header{display:flex;flex-direction:column;gap:8px}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:44px;height:auto;flex:none}
header h1{font-family:var(--font-head);font-weight:700;font-size:1.45rem;line-height:1.2;margin:0;color:var(--teal);text-wrap:balance}
header p{margin:0;color:var(--muted)}

.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:64px;border:0;border-radius:12px;
  background:var(--teal);color:#ffffff;font:700 1.15rem var(--font-body);cursor:pointer;text-decoration:none}
.btn:active{background:var(--teal-dark)}
.btn.secondary{background:var(--surface);color:var(--teal);border:2px solid var(--teal);min-height:52px;font-size:1rem}
.btn:focus-visible,input:focus-visible,summary:focus-visible,.linkbtn:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
.btn svg{width:26px;height:26px}
.linkbtn{background:none;border:0;padding:0;color:var(--teal);font:inherit;font-size:.95rem;text-decoration:underline;cursor:pointer;align-self:center}

.status{min-height:1.5em;color:var(--muted)}
.status:empty{display:none}
.status.err{color:var(--warn);background:var(--warn-bg);padding:10px 12px;border-radius:10px}

.panel{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--yellow);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.label{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.code-box{background:#ffffff;border-radius:10px;padding:18px 10px;display:flex;justify-content:center}
.code-box svg{width:100%;height:auto;max-height:42vh}
.code-text{font:700 1.5rem var(--font-mono);letter-spacing:.06em;text-align:center;word-break:break-all;font-variant-numeric:tabular-nums}
.meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:.9rem;color:var(--muted)}
.meta strong{color:var(--ok)}

.empty{text-align:center;color:var(--muted);padding:28px 8px;border:2px dashed var(--line);border-radius:14px;background:var(--surface)}
.empty b{display:block;color:var(--fg);font-size:1.05rem;margin-bottom:4px}

details{color:var(--muted);font-size:.95rem;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
summary{cursor:pointer;color:var(--fg);font-weight:700}
details[open] summary{margin-bottom:16px}
details ol{padding-left:1.2em;margin:0;display:flex;flex-direction:column;gap:4px}
.manual{display:flex;gap:8px}
.manual input{flex:1;min-width:0;font:500 1.05rem var(--font-mono);padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.manual .btn{min-height:auto;width:auto;padding:0 18px;font-size:1rem}
.version{text-align:center;font-size:.8rem;color:var(--muted);margin:0}

/* Live scanner overlay */
#scanner{position:fixed;inset:0;z-index:50;background:#000;display:flex;flex-direction:column}
#scanner video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mask{position:absolute;inset:0;pointer-events:none}
#frame{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);width:84%;max-width:520px;aspect-ratio:3/1;
  border-radius:10px;box-shadow:0 0 0 100vmax rgba(0,0,0,.55);outline:3px solid var(--yellow)}
#frame::after{content:"";position:absolute;left:6%;right:6%;top:50%;height:2px;background:rgba(228,200,0,.85)}
@media (prefers-reduced-motion:no-preference){#frame::after{animation:sweep 1.6s ease-in-out infinite alternate}
  @keyframes sweep{from{transform:translateY(-14px)}to{transform:translateY(14px)}}}
#frame.hit{outline-color:#4ade80}
.scan-top,.scan-bottom{position:relative;z-index:2;color:#fff;text-align:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.scan-top{padding-top:calc(env(safe-area-inset-top,0px) + 18px);font-weight:700;font-size:1.05rem}
.scan-top small{display:block;font-weight:400;font-size:.9rem;opacity:.85}
.scan-bottom{margin-top:auto;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 22px);display:flex;flex-direction:column;gap:10px;align-items:center}
.scan-row{display:flex;gap:12px;width:100%;max-width:360px;align-items:stretch}
.scan-row .btn{flex:1;background:#ffffff;color:var(--teal);min-height:54px}
.torch{flex:none;width:54px;height:54px;border-radius:50%;border:2px solid #ffffff;background:rgba(0,0,0,.35);color:#ffffff;
  display:grid;place-items:center;cursor:pointer;padding:0}
.torch svg{width:26px;height:26px}
.torch[aria-pressed="true"]{background:var(--yellow);border-color:var(--yellow);color:var(--fg)}
.scan-bottom .linkbtn{color:#fff}

/* result actions */
.result-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.result-actions .btn{min-height:52px;font-size:1rem}

/* format warning */
#warn,#shareWarn{position:fixed;inset:0;z-index:60;background:rgba(31,43,51,.6);display:flex;align-items:center;justify-content:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.warn-card{background:var(--surface);width:100%;max-width:420px;border-radius:16px;border-top:5px solid var(--warn);padding:22px;display:flex;flex-direction:column;gap:12px}
.warn-card h2{font-family:var(--font-head);font-size:1.25rem;margin:0;color:var(--warn)}
.warn-card p{margin:0;color:var(--muted)}
.warn-code{font:700 1.3rem var(--font-mono);letter-spacing:.05em;color:var(--fg);background:var(--bg);border-radius:8px;padding:8px 10px;word-break:break-all;text-align:center}
.warn-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.warn-actions .btn{min-height:52px;font-size:1rem}
.privacy ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.privacy b{color:var(--fg)}
.share-card{border-top-color:var(--yellow)}
.share-card h2{color:var(--fg)}
.share-card .q{color:var(--fg);font-weight:700;margin-top:4px}
.codearea{display:grid}
.codearea>*{grid-area:1/1;min-width:0}
.ghost{visibility:hidden}
.placeholder{border-top-color:var(--line);justify-content:center}
.placeholder .code-box svg{fill:#9fb0b3;opacity:.45;filter:blur(1.2px) grayscale(1);height:120px}
.sections{display:flex;flex-direction:column;gap:10px}
header{margin-bottom:6px}
</style>
</head>
<body>
<main>
  <header>
    <div class="brand">
      <svg viewBox="0 0 57.74 50" role="img" aria-label="Fonkelzorg">
        <path d="M14.4362 49.9999H43.2992L14.4362 33.3333V49.9999Z" fill="#48AA85"/>
        <path d="M0 24.9978L14.4361 50.0001V16.6667L0 24.9978Z" fill="#A2D0AA"/>
        <path d="M14.4361 0L0 25.0023L28.8676 8.33564L14.4361 0Z" fill="#F2E559"/>
        <path d="M43.2992 0V33.3333L57.7353 25.0023L43.2992 0Z" fill="#8DD0E1"/>
        <path d="M28.8677 41.6642L43.3038 49.9999L57.7353 25.0022L28.8677 41.6642Z" fill="#398C8E"/>
        <path d="M14.4362 0L43.2992 16.6667V0H14.4362Z" fill="#E4C900"/>
      </svg>
      <h1 data-t="titel"></h1>
    </div>
  </header>

  <div class="codearea">
  <section id="result" class="ghost" aria-hidden="true">
    <div class="panel">
      <div class="label" data-t="houdOnderScanner"></div>
      <div class="code-box"><svg id="barcode" role="img" data-t-attr="aria-label:barcodeLabel"></svg></div>
      <div class="code-text" id="codeText"></div>
      <div class="meta"><span data-t="gelezenOm"></span><span id="expires"></span></div>
      <div class="result-actions">
        <button class="btn secondary" id="shareBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3M8 7l4-4 4 4"/><path d="M7 10H5v11h14V10h-2"/></svg>
          <span id="shareLabel" data-t="knopDelen"></span>
        </button>
        <button class="btn secondary" id="clearBtn" type="button" data-t="knopWissen"></button>
      </div>
    </div>
  </section>

  <div class="panel placeholder" id="empty" data-t-attr="aria-label:leegVakLabel">
    <div class="code-box"><svg viewBox="0 0 306 80" preserveAspectRatio="none" aria-hidden="true"><rect x="6" y="0" width="3" height="80"/><rect x="12" y="0" width="4" height="80"/><rect x="18" y="0" width="2" height="80"/><rect x="25" y="0" width="2" height="80"/><rect x="30" y="0" width="6" height="80"/><rect x="38" y="0" width="6" height="80"/><rect x="47" y="0" width="2" height="80"/><rect x="51" y="0" width="4" height="80"/><rect x="59" y="0" width="2" height="80"/><rect x="64" y="0" width="2" height="80"/><rect x="71" y="0" width="4" height="80"/><rect x="77" y="0" width="6" height="80"/><rect x="85" y="0" width="2" height="80"/><rect x="92" y="0" width="2" height="80"/><rect x="99" y="0" width="6" height="80"/><rect x="109" y="0" width="2" height="80"/><rect x="114" y="0" width="2" height="80"/><rect x="121" y="0" width="2" height="80"/><rect x="126" y="0" width="4" height="80"/><rect x="133" y="0" width="6" height="80"/><rect x="141" y="0" width="6" height="80"/><rect x="150" y="0" width="6" height="80"/><rect x="159" y="0" width="2" height="80"/><rect x="166" y="0" width="6" height="80"/><rect x="175" y="0" width="3" height="80"/><rect x="180" y="0" width="6" height="80"/><rect x="188" y="0" width="6" height="80"/><rect x="196" y="0" width="6" height="80"/><rect x="205" y="0" width="4" height="80"/><rect x="214" y="0" width="4" height="80"/><rect x="221" y="0" width="4" height="80"/><rect x="230" y="0" width="4" height="80"/><rect x="237" y="0" width="3" height="80"/><rect x="243" y="0" width="2" height="80"/><rect x="248" y="0" width="2" height="80"/><rect x="255" y="0" width="3" height="80"/><rect x="263" y="0" width="4" height="80"/><rect x="270" y="0" width="4" height="80"/><rect x="277" y="0" width="6" height="80"/><rect x="285" y="0" width="2" height="80"/><rect x="292" y="0" width="4" height="80"/></svg></div>
  </div>
  </div>

  <button class="btn" type="button" id="scanBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M7 12h10"/></svg>
    <span data-t="knopScannen"></span>
  </button>
  <input type="file" id="photo" accept="image/*" capture="environment" hidden>

  <div class="status" id="status" role="status" aria-live="polite"></div>

  <div class="sections">
  <details>
    <summary data-t="handmatigTitel"></summary>
    <form class="manual" id="manualForm">
      <input id="manualInput" inputmode="text" autocomplete="off" data-t-attr="placeholder:handmatigVeld;aria-label:handmatigVeld">
      <button class="btn" type="submit" data-t="knopToon"></button>
    </form>
  </details>

  <details>
    <summary data-t="instructieTitel"></summary>
    <ol>
      <li data-t="instructie1"></li>
      <li data-t="instructie2"></li>
      <li data-t="instructie3"></li>
      <li data-t="instructie4"></li>
      <li data-t="instructie5"></li>
    </ol>
  </details>

  <details>
    <summary data-t="tipsTitel"></summary>
    <ol>
      <li data-t="tip1"></li>
      <li data-t="tip2"></li>
      <li data-t="tip3"></li>
      <li data-t="tip4"></li>
    </ol>
  </details>

  <details class="privacy">
    <summary data-t="privacyTitel"></summary>
    <ul>
      <li data-t="privacy1"></li>
      <li data-t="privacy2"></li>
      <li data-t="privacy3"></li>
      <li data-t="privacy4"></li>
      <li data-t="privacy5"></li>
      <li data-t="privacy6"></li>
      <li data-t="privacy7"></li>
    </ul>
  </details>
  </div>

  <p class="version" data-t="versieRegel" data-var-versie="1.4.0"></p>
</main>

<div id="scanner" hidden role="dialog" aria-modal="true" data-t-attr="aria-label:scannerLabel">
  <video id="video" playsinline muted autoplay></video>
  <div class="mask"><div id="frame"></div></div>
  <div class="scan-top"><span data-t="scanKader"></span><small data-t="scanKaderUitleg"></small></div>
  <div class="scan-bottom">
    <div class="scan-row">
      <button class="torch" type="button" id="torchBtn" aria-pressed="false" data-t-attr="aria-label:lampAan" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2h8v4l-2 4v11a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1V10L8 6z"/><path d="M8 6h8M12 13v2"/></svg>
      </button>
      <button class="btn" type="button" id="cancelScan" data-t="knopAnnuleren"></button>
    </div>
    <button class="linkbtn" type="button" id="usePhoto" data-t="knopCameraWerktNiet"></button>
  </div>
</div>

<div id="shareWarn" class="modal" hidden role="alertdialog" aria-modal="true" aria-labelledby="shareTitle" aria-describedby="shareText">
  <div class="warn-card share-card">
    <h2 id="shareTitle" data-t="delenTitel"></h2>
    <p id="shareText" data-t="delenTekst"></p>
    <p data-t="delenMeerInfo"></p>
    <p class="q" data-t="delenVraag"></p>
    <div class="warn-actions">
      <button class="btn secondary" type="button" id="shareNo" data-t="knopNee"></button>
      <button class="btn" type="button" id="shareYes" data-t="knopJaDelen"></button>
    </div>
  </div>
</div>

<div id="warn" hidden role="alertdialog" aria-modal="true" aria-labelledby="warnTitle" aria-describedby="warnText">
  <div class="warn-card">
    <h2 id="warnTitle" data-t="warnTitel"></h2>
    <p id="warnText" data-t="warnUitleg"></p>
    <div class="warn-code" id="warnCode"></div>
    <p data-t="warnControle"></p>
    <div class="warn-actions">
      <button class="btn" type="button" id="warnRetry" data-t="knopOpnieuw"></button>
      <button class="btn secondary" type="button" id="warnUse" data-t="knopTochGebruiken"></button>
    </div>
  </div>
</div>

<script src="vertalen.js"></script>
<script>
(function(){
  // zonder teksten kan de app niet werken: liever een duidelijke melding dan een leeg scherm
  if(!window.T){
    document.querySelector("main").innerHTML='<p class="status err">De app kan niet starten: het bestand met teksten (teksten.js) ontbreekt of bevat een fout.</p>';
    return;
  }
  var t=T.t;
  T.vertaal({tijd:'<strong id="time"></strong>'});

  var EXPIRE_MIN = 10;          // code verdwijnt automatisch, tegen verwisseling met de volgende patiënt
  var SCAN_INTERVAL = 140;      // ms tussen twee pogingen
  var CONFIRM_READS = 2;        // aantal gelijke lezingen achter elkaar voordat de code wordt geaccepteerd
  var IGNORE_MS = 4000;         // na "Opnieuw" wordt dezelfde afwijkende code zo lang genegeerd
  var CODE_FORMAT = /^ZD\d{9}$/; // verwijscode: ZD gevolgd door 9 cijfers
  var $ = function(id){return document.getElementById(id)};
  var statusEl=$("status"), timer=null, wakeLock=null;
  var stream=null, track=null, scanning=false, paused=false, loopTimer=null, lastRead=null, readCount=0;
  var ignoredCode=null, ignoreUntil=0, torchOn=false, currentCode="";
  var work=document.createElement("canvas"), wctx=work.getContext("2d",{willReadFrequently:true});
  var detector=null;
  try{ if("BarcodeDetector" in window) detector=new BarcodeDetector({formats:["code_128"]}) }catch(e){ detector=null }

  setTimeout(function(){ renderGhost() },0);
  function store(k,v){ try{ if(v===null) localStorage.removeItem(k); else localStorage.setItem(k,v) }catch(e){} }
  function load(k){ try{ return localStorage.getItem(k) }catch(e){ return null } }
  function setStatus(msg, err){statusEl.textContent=msg||"";statusEl.className="status"+(err?" err":"")}
  function isValid(code){ return CODE_FORMAT.test(code) }

  /* ---------- tonen en wissen ---------- */
  // Onzichtbare opvulling met een code van dezelfde lengte als een verwijscode, zodat het vak
  // leeg en gevuld even hoog is en de knop Code scannen op een vaste plek blijft. Niet zichtbaar, dus niet scanbaar.
  function renderGhost(){
    try{ JsBarcode("#barcode","ZD000000000",{format:"CODE128",displayValue:false,margin:12,width:3,height:120,background:"#ffffff",lineColor:"#000000"}) }catch(e){}
    $("codeText").textContent="ZD000000000"; $("time").textContent="00:00"; $("expires").textContent=t("wordtGewist",{min:EXPIRE_MIN});
    $("result").classList.add("ghost"); $("result").setAttribute("aria-hidden","true");
  }
  function hasCode(){ return !$("result").classList.contains("ghost") }
  function show(code){
    code=String(code).trim();
    try{
      JsBarcode("#barcode", code, {format:"CODE128", displayValue:false, margin:12, width:3, height:120, background:"#ffffff", lineColor:"#000000"});
    }catch(e){setStatus(t("meldingNietTonen"),true);return}
    currentCode=code;
    $("codeText").textContent=code;
    $("time").textContent=new Date().toLocaleTimeString(T.taal,{hour:"2-digit",minute:"2-digit"});
    $("expires").textContent=t("wordtGewist",{min:EXPIRE_MIN});
    $("shareLabel").textContent=t("knopDelen");
    $("result").classList.remove("ghost");$("result").removeAttribute("aria-hidden");$("empty").hidden=true;setStatus("");
    clearTimeout(timer);timer=setTimeout(clearCode,EXPIRE_MIN*60000);
    requestWake();
    $("result").scrollIntoView({behavior:"smooth",block:"nearest"});
  }
  function clearCode(){
    clearTimeout(timer); currentCode=""; $("shareWarn").hidden=true;
    renderGhost();$("empty").hidden=false;
    if(wakeLock){try{wakeLock.release()}catch(e){}wakeLock=null}
    setStatus(t("meldingGewist"));
  }
  function requestWake(){
    try{ if(navigator.wakeLock){navigator.wakeLock.request("screen").then(function(l){wakeLock=l}).catch(function(){})} }catch(e){}
  }

  /* ---------- formaatcontrole ---------- */
  var warnUse=null, warnRetry=null;
  function showWarn(code, onUse, onRetry){
    $("warnCode").textContent=code||t("warnLeeg");
    warnUse=onUse; warnRetry=onRetry;
    $("warn").hidden=false; $("warnRetry").focus();
  }
  function closeWarn(){ $("warn").hidden=true }
  $("warnUse").addEventListener("click",function(){ closeWarn(); var f=warnUse; warnUse=warnRetry=null; f&&f() });
  $("warnRetry").addEventListener("click",function(){ closeWarn(); var f=warnRetry; warnUse=warnRetry=null; f&&f() });
  // geldige code direct tonen, anders eerst waarschuwen
  function accept(code, onRetry){
    code=String(code).trim();
    if(isValid(code)){ show(code); return }
    showWarn(code, function(){ show(code) }, onRetry);
  }

  /* ---------- delen ---------- */
  // eerst de privacywaarschuwing, pas na "Ja, delen" het deelmenu
  $("shareBtn").addEventListener("click", function(){
    if(!currentCode) return;
    $("shareWarn").hidden=false; $("shareNo").focus();
  });
  function closeShareWarn(){ $("shareWarn").hidden=true; $("shareBtn").focus() }
  $("shareNo").addEventListener("click", closeShareWarn);
  $("shareYes").addEventListener("click", async function(){
    $("shareWarn").hidden=true;
    if(!currentCode) return;
    if(navigator.share){
      try{ await navigator.share({text:currentCode}); return }
      catch(e){ if(e&&e.name==="AbortError") return }   // gebruiker sloot het deelmenu
    }
    try{ await navigator.clipboard.writeText(currentCode); $("shareLabel").textContent=t("knopGekopieerd") }
    catch(e){
      var r=document.createRange(); r.selectNodeContents($("codeText"));
      var sel=getSelection(); sel.removeAllRanges(); sel.addRange(r);
      setStatus(t("meldingKopierenMislukt"));
    }
  });

  /* ---------- decoderen ---------- */
  function zxingDecode(canvas){
    var hints=new Map();
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.CODE_128]);
    hints.set(ZXing.DecodeHintType.TRY_HARDER,true);
    var reader=new ZXing.MultiFormatReader(); reader.setHints(hints);
    var src=new ZXing.HTMLCanvasElementLuminanceSource(canvas);
    // eerst de omzetting voor streepjescodes, dan de algemene: samen lezen ze vaker een licht onscherp beeld
    try{ return reader.decode(new ZXing.BinaryBitmap(new ZXing.GlobalHistogramBinarizer(src))).getText() }catch(e){}
    return reader.decode(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(src))).getText();
  }
  async function decodeCanvas(canvas){
    if(detector){
      try{ var f=await detector.detect(canvas); if(f&&f.length) return f[0].rawValue }catch(e){}
    }
    if(window.ZXing){ try{ return zxingDecode(canvas) }catch(e){} }
    return null;
  }

  /* ---------- live scannen binnen het kader ---------- */
  function frameCropInVideo(){
    var v=$("video"), vw=v.videoWidth, vh=v.videoHeight;
    if(!vw||!vh) return null;
    var vr=v.getBoundingClientRect(), fr=$("frame").getBoundingClientRect();
    var scale=Math.max(vr.width/vw, vr.height/vh);           // object-fit: cover
    var offX=(vr.width-vw*scale)/2, offY=(vr.height-vh*scale)/2;
    var pad=0.04;                                            // klein beetje marge rond het kader
    var x=(fr.left-vr.left-offX)/scale, y=(fr.top-vr.top-offY)/scale;
    var w=fr.width/scale, h=fr.height/scale;
    x-=w*pad; y-=h*pad; w*=1+2*pad; h*=1+2*pad;
    x=Math.max(0,x); y=Math.max(0,y); w=Math.min(vw-x,w); h=Math.min(vh-y,h);
    return {x:x,y:y,w:w,h:h,vw:vw,vh:vh};
  }
  function resumeScan(){ paused=false; lastRead=null; readCount=0; $("frame").classList.remove("hit"); loopTimer=setTimeout(scanTick, SCAN_INTERVAL) }
  async function scanTick(){
    if(!scanning||paused) return;
    var c=frameCropInVideo();
    if(c){
      // ingebouwde herkenning (Android): uitsnede 2x vergroten, dunne streepjes worden dan betrouwbaarder herkend.
      // ZXing (iPhone, geen ingebouwde herkenning): niet vergroten, het vervagen bij vergroten maakt lezen juist moeilijker.
      var up=detector?2:1;
      var outW=Math.min(1600, Math.round(c.w*up)), outH=Math.max(1, Math.round(c.h*outW/c.w));
      work.width=outW; work.height=outH;
      wctx.drawImage($("video"), c.x, c.y, c.w, c.h, 0, 0, outW, outH);
      var code=await decodeCanvas(work);
      if(!scanning||paused) return;
      if(code){ code=String(code).trim() }
      if(code && !(code===ignoredCode && Date.now()<ignoreUntil)){
        if(code===lastRead){ readCount++ } else { lastRead=code; readCount=1 }
        if(readCount>=CONFIRM_READS){
          try{ navigator.vibrate&&navigator.vibrate(80) }catch(e){}
          if(isValid(code)){
            $("frame").classList.add("hit"); stopScanner(); show(code); return;
          }
          paused=true;
          showWarn(code,
            function(){ stopScanner(); show(code) },
            function(){ ignoredCode=code; ignoreUntil=Date.now()+IGNORE_MS; resumeScan() });
          return;
        }
      }
    }
    loopTimer=setTimeout(scanTick, SCAN_INTERVAL);
  }

  /* lamp */
  function hasTorch(t){ try{ var c=t.getCapabilities?t.getCapabilities():{}; return !!c.torch }catch(e){ return false } }
  async function setTorch(on){
    if(!track) return false;
    try{ await track.applyConstraints({advanced:[{torch:on}]}) }
    catch(e){ try{ await track.applyConstraints({torch:on}) }catch(e2){ return false } }
    torchOn=on;
    $("torchBtn").setAttribute("aria-pressed",on?"true":"false");
    $("torchBtn").setAttribute("aria-label",t(on?"lampUit":"lampAan"));
    return true;
  }
  $("torchBtn").addEventListener("click",async function(){
    var want=!torchOn;
    if(await setTorch(want)) store("crp.torch", want?"1":"0");
  });

  /* belichting en scherpstelling op het kader richten */
  async function tuneCamera(){
    if(!track) return;
    var caps={}; try{ caps=track.getCapabilities?track.getCapabilities():{} }catch(e){}
    var adv={};
    if(caps.focusMode&&caps.focusMode.indexOf("continuous")>-1) adv.focusMode="continuous";
    if(caps.exposureMode&&caps.exposureMode.indexOf("continuous")>-1) adv.exposureMode="continuous";
    if(caps.whiteBalanceMode&&caps.whiteBalanceMode.indexOf("continuous")>-1) adv.whiteBalanceMode="continuous";
    var sup={}; try{ sup=navigator.mediaDevices.getSupportedConstraints()||{} }catch(e){}
    var c=frameCropInVideo();
    if(sup.pointsOfInterest&&c){
      adv.pointsOfInterest=[{x:Math.min(1,Math.max(0,(c.x+c.w/2)/c.vw)), y:Math.min(1,Math.max(0,(c.y+c.h/2)/c.vh))}];
    }
    for(var k in adv){
      var one={}; one[k]=adv[k];
      try{ await track.applyConstraints({advanced:[one]}) }catch(e){}   // per instelling, zodat één weigering de rest niet blokkeert
    }
  }

  function openStream(deviceId){
    var v=deviceId?{deviceId:{exact:deviceId},width:{ideal:1920},height:{ideal:1080}}
                  :{facingMode:{ideal:"environment"},width:{ideal:1920},height:{ideal:1080}};
    return navigator.mediaDevices.getUserMedia({audio:false,video:v});
  }
  function stopTracks(s){ if(s) s.getTracks().forEach(function(t){t.stop()}) }

  // Android: als de gekozen camera geen lamp heeft, zoek een andere camera achterop die er wel een heeft
  async function findTorchCamera(){
    if(/iPhone|iPad|iPod/.test(navigator.userAgent)) return;
    var devs=[]; try{ devs=(await navigator.mediaDevices.enumerateDevices()).filter(function(d){return d.kind==="videoinput"}) }catch(e){ return }
    if(devs.length<2) return;
    var currentId=(track.getSettings&&track.getSettings().deviceId)||"";
    var tried=0;
    for(var i=0;i<devs.length&&tried<3;i++){
      var d=devs[i]; if(!d.deviceId||d.deviceId===currentId) continue;
      if(/front|voor|user/i.test(d.label)) continue;
      tried++;
      var s=null;
      try{
        stopTracks(stream); stream=null;
        s=await openStream(d.deviceId);
        var t=s.getVideoTracks()[0], fm=(t.getSettings&&t.getSettings().facingMode)||"";
        if(hasTorch(t)&&fm!=="user"){ stream=s; track=t; store("crp.cameraId",d.deviceId); return }
        stopTracks(s);
      }catch(e){ stopTracks(s) }
    }
    // niets gevonden: terug naar de oorspronkelijke camera
    try{ stream=await openStream(currentId||null) }catch(e){ stream=await openStream(null) }
    track=stream.getVideoTracks()[0];
  }

  async function startScanner(){
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){ openPhotoPicker(); return }
    setStatus("");
    $("frame").classList.remove("hit"); lastRead=null; readCount=0; paused=false; ignoredCode=null;
    $("torchBtn").hidden=true; torchOn=false;
    $("scanner").hidden=false;
    try{
      var saved=load("crp.cameraId");
      try{ stream=saved?await openStream(saved):await openStream(null) }
      catch(e){ if(saved){ store("crp.cameraId",null); stream=await openStream(null) } else throw e }
    }catch(e){
      $("scanner").hidden=true;
      setStatus(e&&e.name==="NotAllowedError"
        ? t("meldingCameraGeenToestemming")
        : t("meldingCameraStartNiet"), true);
      showPhotoHint();
      return;
    }
    track=stream.getVideoTracks()[0];
    if(!hasTorch(track)){ try{ await findTorchCamera() }catch(e){} }
    if($("scanner").hidden){ stopTracks(stream); stream=null; return }   // intussen geannuleerd
    var v=$("video"); v.srcObject=stream;
    try{ await v.play() }catch(e){}
    if(hasTorch(track)){
      $("torchBtn").hidden=false;
      if(load("crp.torch")==="1") await setTorch(true);
    }
    scanning=true;
    setTimeout(tuneCamera, 300);   // pas als het beeld er is, zodat de positie van het kader bekend is
    scanTick();
  }
  function stopScanner(){
    scanning=false; paused=false; clearTimeout(loopTimer);
    stopTracks(stream); stream=null; track=null; torchOn=false;
    $("video").srcObject=null;
    $("scanner").hidden=true;
  }

  /* ---------- reserve: gewone foto ---------- */
  function openPhotoPicker(){ $("photo").click() }
  function showPhotoHint(){
    if($("photoFallback")) return;
    var b=document.createElement("button"); b.type="button"; b.className="linkbtn"; b.id="photoFallback";
    b.textContent=t("knopGewoneFoto"); b.addEventListener("click",openPhotoPicker);
    statusEl.after(b);
  }
  function loadImage(file){
    return new Promise(function(res,rej){
      var url=URL.createObjectURL(file), img=new Image();
      img.onload=function(){res(img)}; img.onerror=function(){URL.revokeObjectURL(url);rej(new Error("img"))};
      img.src=url;
    });
  }
  function canvasFor(img, maxW, rotate){
    var s=Math.min(1, maxW/Math.max(img.naturalWidth,img.naturalHeight));
    var w=Math.round(img.naturalWidth*s), h=Math.round(img.naturalHeight*s);
    var c=document.createElement("canvas"), ctx=c.getContext("2d");
    if(rotate){c.width=h;c.height=w;ctx.translate(h,0);ctx.rotate(Math.PI/2)}else{c.width=w;c.height=h}
    ctx.drawImage(img,0,0,w,h);
    return c;
  }
  $("photo").addEventListener("change", async function(ev){
    var f=ev.target.files&&ev.target.files[0]; ev.target.value="";
    if(!f) return;
    setStatus(t("meldingBarcodeLezen"));
    try{
      var img=await loadImage(f), code=null;
      var tries=[[1600,false],[1100,false],[2400,false],[1600,true],[800,false]];
      for(var i=0;i<tries.length&&!code;i++){ code=await decodeCanvas(canvasFor(img,tries[i][0],tries[i][1])) }
      URL.revokeObjectURL(img.src);
      if(!code) throw new Error("none");
      setStatus("");
      accept(code, function(){ setStatus(t("meldingNieuweFoto")) });
    }catch(e){
      setStatus(t("meldingGeenBarcode"), true);
    }
  });

  /* ---------- knoppen ---------- */
  $("scanBtn").addEventListener("click",startScanner);
  $("cancelScan").addEventListener("click",stopScanner);
  $("usePhoto").addEventListener("click",function(){ stopScanner(); openPhotoPicker() });
  $("manualForm").addEventListener("submit",function(e){
    e.preventDefault(); var v=$("manualInput").value.trim();
    if(!v){setStatus(t("meldingVulCodeIn"),true);return}
    accept(v, function(){ $("manualInput").value=v; $("manualInput").focus() });
    if(isValid(v)) $("manualInput").value="";
  });
  $("clearBtn").addEventListener("click",clearCode);
  document.addEventListener("keydown",function(e){
    if(e.key!=="Escape") return;
    if(!$("shareWarn").hidden){ closeShareWarn(); return }
    if(!$("warn").hidden){ $("warnRetry").click(); return }
    if(scanning) stopScanner();
  });
  document.addEventListener("visibilitychange",function(){
    if(document.visibilityState==="hidden"&&scanning){ closeWarn(); stopScanner() }   // camera vrijgeven als de app naar de achtergrond gaat
    if(document.visibilityState==="visible"&&hasCode()) requestWake();
  });
})();
</script>
<script>
if("serviceWorker" in navigator){
  // Is er al een oudere versie actief, dan herlaadt de app zichzelf één keer zodra de nieuwe versie klaarstaat.
  var hadController=!!navigator.serviceWorker.controller, reloaded=false;
  navigator.serviceWorker.addEventListener("controllerchange",function(){
    if(!hadController||reloaded) return;
    var busy=!document.getElementById("result").classList.contains("ghost")||!document.getElementById("scanner").hidden;
    if(busy) return;                 // nooit herladen terwijl er een code op het scherm staat of de camera aan is
    reloaded=true; location.reload();
  });
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(function(reg){
      document.addEventListener("visibilitychange",function(){
        if(document.visibilityState==="visible") reg.update().catch(function(){});   // ook bij terugkeren naar de app op updates controleren
      });
    }).catch(function(){});
  });
}
</script>
</body>
